<div class="boutons">
  <button (click)="previous()" [disabled]="offset === 0">Précédent</button>
  <button (click)="next()">Suivant</button>
</div>

<div class="container">

  <h2>Liste des Pokémon</h2>

  <!-- Barre de recherche -->
  <div class="search-bar">

    <input [(ngModel)]="searchTerm" (input)="filterPokemons()" placeholder="Rechercher un Pokémon...">

    <select [(ngModel)]="selectedType" (change)="filterPokemons()">
      <option value="">Tous les types</option>
      <option *ngFor="let type of types" [value]="type">{{ type }}</option>
    </select>

    <select [(ngModel)]="selectedGeneration" (change)="onGenerationChange()">
      <option value="">Toutes les générations</option>
      <option *ngFor="let gen of generations" [value]="gen.id">{{ gen.label }}</option>
    </select>

<!--<app-generations></app-generations>-->
</div>

<p>{{ filteredPokemons.length }} Pokémon trouvés</p>
  <!-- Liste -->
  <div class="pokemon-grid">

    <div *ngFor="let pokemon of filteredPokemons">
      <app-pokemon
        [pokemon]="pokemon">
      </app-pokemon>
    </div>

  </div>

</div>
